[project]
name = "health-log"
version = "0.2.0"
description = "可核对、可追溯的饮食与体重记录引擎"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
    "pyyaml>=6.0",
]

[project.scripts]
hl = "hl.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "build>=1.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hl"]

[tool.hatch.build.targets.sdist]
# Public source distribution: private development files never enter the package.
only-include = [
    "src/hl",
    "scripts/bootstrap.py",
    "scripts/hl.py",
    "scripts/runtime.py",
    "pyproject.toml",
    "uv.lock",
    ".gitignore",
    "README.md",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "docs/user-guide.md",
    "docs/portable-install.md",
    "docs/migration.md",
    "docs/agent-integration.md",
    "docs/architecture.md",
    "docs/publication.md",
    "data/foods/README.md",
    "data/foods/manifest.json",
]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
