# 做法与油盐（增补第 10 节）、拆菜辅料表（增补第 8.2 节）。
#
# methods：做法词分档（认词用，src/hl/foods/lexicon.py）。
# 做法词连着一样食物时（炒鸡蛋、鸡胸肉煎的）：前三档按这样食物记，“加盐”“加油和盐”两档另加
# 估算的油盐行；“另一种食物”那一档连在食物前面时，整个算另一种食物（第 2.5 节）。
# 做法词两边都连着食物时（韭菜炒鸡蛋），整个算一道菜的名字（第 2.4 节）。
# 油盐比例（每个数带出处）在后面的 seasoning 一节，src/hl/cooking.py 读。
methods:
  不加: [蒸, 清蒸, 煮, 水煮, 白灼, 焯, 涮]
  加盐: [炖, 卤, 凉拌, 拌, 烤]
  加油和盐: [炒, 清炒, 爆炒, 爆, 熘, 煎, 红烧, 烧, 油焖, 焖, 烩, 炝, 煸, 干煸, 扒, 煨]
  另一种食物: [炸, 油炸, 拔丝, 糖醋]

# aux：拆菜辅料表，只在估算通道的 parts 里生效（模型拆菜时写的“油”“盐”“葱”），认法排在
# ref、词典里的食物词、成分表名称、薄荷库同名之后。每个词指向下面的一种：
#   concept：概念表里的概念，按它的默认品种记；概念表里还没有这个概念时退回 food；
#   food：条目编码（不带前缀的是成分表的，x:salt 是内置食盐）；
#   water: true：水、汤，不计热量，也不写明细行，只算进 parts 的克数里。
# 成分表第 6 版没有调味品和糖的条目：酱油、生抽、老抽、醋、料酒、蚝油、豆瓣酱、白砂糖
# 都不在这里。装了薄荷库时按“薄荷库同名”认；没装时认不出，fix 叫模型去掉这一项或换成库里有的。
aux:
  油: {concept: 食用油, food: "192014", note: 色拉油}
  食用油: {concept: 食用油, food: "192014", note: 色拉油}
  盐: {food: "x:salt"}
  食盐: {food: "x:salt"}
  葱: {food: "044205", note: 葱（小葱，鲜）}
  小葱: {food: "044205", note: 葱（小葱，鲜）}
  葱花: {food: "044205", note: 葱（小葱，鲜）}
  姜: {food: "047301", note: 姜（鲜）}
  生姜: {food: "047301", note: 姜（鲜）}
  蒜: {food: "044101", note: 大蒜（白皮，鲜）}
  大蒜: {food: "044101", note: 大蒜（白皮，鲜）}
  蒜末: {food: "044101", note: 大蒜（白皮，鲜）}
  辣椒: {food: "043123", note: 辣椒（青、尖）}
  淀粉: {food: "022103", note: 玉米淀粉}
  水: {water: true}
  清水: {water: true}
  高汤: {water: true}

# seasoning：做法估算的油盐（增补第 10 节、第 8.4 节），src/hl/cooking.py 读。
# 前三个数是每 100 克可食部生重加多少克；数据目录里的 cooking.yaml 可以盖掉它们（只写想改的，
# 例如做菜少油的人写 “素菜油: 3”），别的键不能盖。
#
# 取值的依据两处，取值放在两者之间（薄荷的配方偏清淡，餐馆偏油）：
#   ① 薄荷库里写了油的 345 道炒菜，每 100 克原料用油的中位数 3.6 克（素菜为主 3.3，荤菜为主 5.6，
#      四分位 2.6 到 6.7）；写了盐的 388 道，盐的中位数 0.8 克（四分位 0.5 到 1.0）。
#      煎、红烧这一档和炒用同一组数（薄荷配方里煎 4.9、烧焖 4.6，差别不大）。
#   ② 职业厨师现做 302 道菜的称重研究（Pu 等，Int J Environ Res Public Health 2019;16:3367）
#      的下锅量：蔬菜中位数 4.8 克，猪肉 11.8，禽肉 8.4，牛羊肉 8.0。
seasoning:
  素菜油:
    g: 4
    source: 薄荷库素菜为主的炒菜中位数 3.3 克，Pu 等 2019 蔬菜中位数 4.8 克，取两者之间
  肉蛋水产油:
    g: 8
    source: 薄荷库荤菜为主的炒菜中位数 5.6 克，Pu 等 2019 猪肉 11.8、禽肉 8.4、牛羊肉 8.0 克，取两者之间
  盐:
    g: 0.8
    source: 薄荷库写了盐的 388 道菜的中位数 0.8 克（四分位 0.5 到 1.0）
  # 荤素按成分表编码前两位分：畜肉 08、禽肉 09、蛋 11、鱼虾蟹贝 12 按肉蛋水产，其余按素菜
  肉蛋水产: ["08", "09", "11", "12"]
  # “烤”对主食（谷类 01）、薯类（薯类淀粉 02）、水果（06）只认出来，不加盐
  烤不加盐: ["01", "02", "06"]
  # 估算通道（第 8.4 节）：parts 里有这几类（成分表编码前两位）、名字里又没有“不加”一档的做法词，
  # 是咸的菜，补盐：蔬菜 04、菌藻 05、畜肉 08、禽肉 09、鱼虾蟹贝 12
  咸的菜: ["04", "05", "08", "09", "12"]
  # 油类、盐类（第 8.4 节）：parts 里有这两类的，以模型写的为准，不再补；油脂类 19，调味品类 20。
  # 内置食盐 x:salt 也算盐类
  油类: ["19"]
  盐类: ["20"]
  # 用户自己说了的油（第 10 节，猪油、黄油也算）：这次调用里有一项是它们、按第 4 节的范围算在
  # 某一项头上，那一项不再自动加油。概念表里各品种都是油脂类（19）的概念（食用油、猪油）也算。
  油的说法: [油, 食用油, 植物油, 黄油, 牛油, 猪油, 荤油, 鸡油, 羊油]
  盐的说法: [盐, 食盐]
