# 份量依据：杯、碗 = 都按 300 毫升（经验估计：家用杯约 250 毫升，早餐店的杯和碗约 300–400 毫升）。
#   density 1.03：USDA 食物与营养数据库的无糖豆奶 1 液量盎司（29.57 毫升）= 30.5 克（在 nutritionvalue.org 上读到）
