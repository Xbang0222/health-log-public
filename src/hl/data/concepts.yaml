  cook: {yield: 2.59, kind: 煮熟, source: "按干物质折算：成分表赤小豆（干）033101 水分 12.6%；成分表没有煮熟的红小豆，熟的水分用 USDA SR「Beans, adzuki, mature seeds, cooked, boiled, without salt」66.29%（nutritionvalue.org 转载页），(100 − 12.6) ÷ (100 − 66.29) ≈ 2.59"}
