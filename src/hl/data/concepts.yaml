# ==================== 油脂 ====================

# 概念名和拆菜辅料表（cooking.yaml 的 aux：“油、食用油”指向概念“食用油”）一致；默认是色拉油。
# 份量依据：density 0.92 克/毫升——Codex Stan 210-1999《Named Vegetable Oils》表 2 的相对密度（20°C）：
#   花生油 0.912–0.920、玉米油 0.917–0.925、菜籽油 0.910–0.920、芝麻油 0.915–0.924、大豆油 0.919–0.925、
#   葵花籽油 0.918–0.923，取中间值；橄榄油在 Codex Stan 33-1981 里是 0.910–0.916，和 0.92 差不到 1%，沿用同一个数。
#   瓷勺、调羹 = 家用白瓷勺一勺油约 10 克（经验估计；依据《我国食用油推荐摄入量是多少？》（中国农村杂志社，2024-05-10）：
#   “每日 25～30 g，相当于普通瓷勺 2～3 勺”；调羹是南方对瓷勺的叫法）。只说“勺”时大小不定（炒勺、大勺、小勺），不收。
#   汤匙、茶匙 = 量勺规格（归入包装规格一类）：公制汤匙 15 毫升，1 汤匙 = 3 茶匙，即茶匙 5 毫升。
#   “汤匙”也有人指喝汤的瓷勺（约 10 克油），两种只差 4 克；按量勺记，因为说“汤匙、茶匙”的多半是照着菜谱量的。
食用油:
  aliases: [食用油, 植物油]
  default: 普通
  density: 0.92
  units: {瓷勺: {g: 10}, 调羹: {g: 10}, 汤匙: {ml: 15}, 茶匙: {ml: 5}}
  variants:
    普通: {food: "192014", names: [色拉油, 调和油]}
    花生油: {food: "192007", names: [花生油]}
    菜籽油: {food: "192001", names: [菜籽油, 菜子油, 菜油]}
    大豆油: {food: "192004", names: [大豆油, 豆油]}
    玉米油: {food: "192016", names: [玉米油]}
    葵花籽油: {food: "192009", names: [葵花籽油, 葵花子油, 葵花油]}
    橄榄油: {food: "192019", names: [橄榄油]}
    芝麻油: {food: "192017", names: [芝麻油, 香油, 麻油, 芝麻香油, 小磨香油]}

猪油:
  aliases: [猪油, 荤油]
  default: 熟猪油
  variants:
    熟猪油: {food: "191007", aliases: [炼猪油]}
    板油: {food: "191006", names: [板油], aliases: [猪板油]}

