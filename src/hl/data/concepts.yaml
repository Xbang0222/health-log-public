  cook: {yield: 2.40, kind: 煮熟, source: "按干物质折算：成分表黄豆 031101 水分 10.2%；成分表没有煮熟的黄豆，熟的水分用 USDA SR「Soybeans, mature seeds, cooked, boiled, without salt」62.55%（nutritionvalue.org 转载页），(100 − 10.2) ÷ (100 − 62.55) ≈ 2.40"}
