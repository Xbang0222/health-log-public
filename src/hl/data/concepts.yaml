# 日常叫法 → 成分表条目。引擎靠这张表决定"要不要追问"，不靠模型判断（增补第 2、5、6、7、13.1 节）。
# food 是《中国食物成分表》第 6 版的食物编码。
#
# aliases：概念别名，单说就是这样食物，原话里出现要有对应项。至少两个字。
# variants：品种。names 是单说也是食物名的品种叫法（牛腩、香油），进词典、带出品种；aliases 是
#   只在认品种时用的叫法（红心、无糖、干的），取词时按中性词占位。品种叫法里包含本概念别名的
#   （全脂牛奶、土鸡蛋），加载时自动算食物名并带出品种，不用写进 names。
# default 是不问就用的品种。各品种差得多的（第 5 节的门槛）不许写 default，引擎必须追问；
#   这样的概念要写 unsure：用户说不清是哪种时用的品种，指向最常见的那种。
# units 里 g 是可食部克数，gross_g 是称出来的整重（引擎乘可食部），ml 按 density 换算成克；
#   variant 是说这个量词就同时定下品种；主食的“两”标 rough: true（食堂口径，不是 50 克）。
# cook：yield = 做熟（kind: 煮熟）或泡发（kind: 泡发）后的重量 ÷ 原来的重量，source 写出处。
#   生的谷物和干豆的 yield 按成分表生熟两条的干物质折算：yield = (100 − 生的水分) ÷ (100 − 熟的水分)。
# net_aliases：这些叫法本身就是净重（虾仁、核桃仁），不问带不带壳。
# cuts：别名后面跟着这些切法字时（牛肉片、豆腐块）仍按这个概念认，不算尾巴（第 2.3 节）。
# lookalikes：包含别名、却是另一种食物的词（第 2.1 节），和 lookalikes.yaml 的 not_same 并在一起。
#   尾巴规则盖得住的（别名后面多一两个字：香蕉片、番茄酱）不用写。
# hl check 会校验这些（src/hl/foods/lint.py）。
#
# 份量依据里的“USDA SR”数字是在 nutritionvalue.org 的转载页上读到的 USDA 数据，只用来对照，
# 不是成分数据的来源；“经验估计”是没读到出处、按常见大小估的数。

# ==================== 主食 ====================

# 份量依据：碗 = 普通饭碗一碗约 150 克熟饭（经验估计）；
#   两 = 食堂说的“一两米饭”是 50 克生米煮出来的量：50 克 × 2.98（见“大米”的 cook）≈ 150 克熟饭。
米饭:
  aliases: [米饭, 白米饭, 白饭, 大米饭, 粳米饭, 籼米饭]
  default: 蒸米饭
  units: {碗: {g: 150}, 两: {g: 150, rough: true}}
  variants:
    蒸米饭: {food: "012401x"}

# 生米。煮好的叫“米饭”，是另一个概念。
# 份量依据：杯 = 电饭煲附带的量杯（1 合，约 180 毫升），装生米约 150 克（经验估计；Wikipedia「Gō (unit)」写 1 合 ≈ 180.4 毫升、常按 150 克米算）
大米:
  aliases: [大米, 白米, 稻米, 粳米, 籼米, 香米]
  default: 普通
  units: {杯: {g: 150}}
  cook: {yield: 2.98, kind: 煮熟, source: "按成分表干物质折算：稻米（代表值）012001x 水分 13.3%，米饭（蒸，代表值）012401x 水分 70.9%，(100 − 13.3) ÷ (100 − 70.9) ≈ 2.98"}
  variants:
    普通: {food: "012001x"}

# 生小米。小米粥另有概念。
小米:
  aliases: [小米]
  default: 普通
  cook: {yield: 3.09, kind: 煮熟, source: "按干物质折算：成分表小米 015101 水分 11.6%；成分表没有小米饭，熟的水分用 USDA SR「Millet, cooked」71.4%（nutritionvalue.org 转载页），(100 − 11.6) ÷ (100 − 71.4) ≈ 3.09"}
  variants:
    普通: {food: "015101"}
  lookalikes: [小米南瓜粥, 小米辣椒]

# 生糙米。糙米饭成分表没有，不能拿白米饭顶，用 cook 折回生重。
糙米:
  aliases: [糙米]
  default: 普通
  cook: {yield: 2.92, kind: 煮熟, source: "按干物质折算：成分表糙米 012216 水分 13.4%；成分表没有糙米饭，熟的水分用 USDA SR「Rice, brown, long-grain, cooked」70.3%（nutritionvalue.org 转载页），(100 − 13.4) ÷ (100 − 70.3) ≈ 2.92"}
  variants:
    普通: {food: "012216"}

# 份量依据：根、个 = 去掉苞叶、带芯的一根鲜玉米约 250 克（经验估计），引擎乘可食部 46%，约 115 克
玉米:
  aliases: [玉米]
  default: 普通
  units: {根: {gross_g: 250}, 个: {gross_g: 250}}
  variants:
    普通: {food: "013101"}
  lookalikes: [玉米面条]

# 份量依据：个 = 普通大小的白馒头约 100 克（经验估计；小刀切馒头约 50 克，食堂大馒头可到 150 克）
馒头:
  aliases: [馒头, 蒸馍]
  default: 普通
  units: {个: {g: 100}}
  variants:
    普通: {food: "011404x"}
  lookalikes: [红糖馒头, 奶香馒头, 牛奶馒头, 金银馒头, 旺仔小馒头]

# 煮好的、干挂面、生面条每 100 克热量差 3 倍，必须问；说不清时按煮好的（碗里端上来的样子）。
# 品种说的是“称的时候是什么状态”，不是面条的种类：挂面、鲜切面、手擀面这些产品名只放在概念别名里，
# 不当品种叫法——否则“吃了一碗鲜切面”会被认成没煮的生面条（300 克 × 301 千卡）。
# 生熟只用品种表达，不写 cook（增补第 7 节：一个概念不得同时用品种和 cook 说同一件事）。
# 份量依据：碗 = 一碗煮好的面条（不算汤）约 300 克，大致是 100 克干挂面煮出来的量（经验估计）。
#   这个数只对“煮好的”成立，所以量词指明品种：说“一碗”就是煮好的；原话里说的是干面条、生面条时这个量词不适用。
面条:
  aliases: [面条, 挂面, 鲜切面, 手擀面, 龙须面]
  unsure: 煮好的
  units: {碗: {g: 300, variant: 煮好的}}
  variants:
    煮好的: {food: "011317", aliases: [煮好, 煮熟, 熟的, 熟重, 熟面条, 煮面条]}
    干挂面: {food: "011301x", aliases: [干面条, 干重]}
    生面条: {food: "011305x", names: [生切面], aliases: [湿面条, 湿的]}
  lookalikes: [魔芋面条, 荞麦面条, 荞麦挂面, 鸡蛋挂面, 鸡蛋面条]

# 份量依据：碗 = 普通饭碗盛一碗粥约 250 克（经验估计）
# “粥”只有一个字不能当别名，概念名用“稀饭”。对的是成分表的粳米粥（46 千卡）；籼米粥（59 千卡）用户分不清，没有单列。
# 小米粥、红豆粥各自单独成概念：说“稀饭、白粥”的人不会是指红豆粥，放在一起只会让引擎白问一次。
稀饭:
  aliases: [稀饭, 白粥, 大米粥, 白米粥, 粳米粥, 清粥, 大米稀饭, 白米稀饭]
  default: 普通
  units: {碗: {g: 250}}
  variants:
    普通: {food: "012404"}
  lookalikes: [八宝稀饭, 杂粮稀饭, 黑米稀饭]

# 份量依据：碗 = 普通饭碗盛一碗粥约 250 克（经验估计）
小米粥:
  aliases: [小米粥, 小米稀饭]
  default: 普通
  units: {碗: {g: 250}}
  variants:
    普通: {food: "015103"}

# 份量依据：碗 = 普通饭碗盛一碗粥约 250 克（经验估计）
# 对的是成分表的“小豆粥”（62 千卡，蛋白 1.2 克），是米多豆少的粥。
红豆粥:
  aliases: [红豆粥, 小豆粥, 赤豆粥, 红小豆粥, 赤小豆粥, 红豆稀饭]
  default: 普通
  units: {碗: {g: 250}}
  variants:
    普通: {food: "033201"}

# 份量依据：根 = 约 80 克（经验估计；读到的数：自制大油条 95 克、肯德基油条 58 克、科普中国按 1 根约 100 克，
#   取这三个数的中间一档往下：早点铺常见的一根）
油条:
  aliases: [油条, 油炸鬼, 油炸桧]
  default: 普通
  units: {根: {g: 80}}
  variants:
    普通: {food: "011409"}

# 成分表只有“烧饼（加糖）”一条（武汉，脂肪 2.1 克）。麻酱、油酥、夹肉的不是它。
# 份量依据：个 = 约 80 克（经验估计：早点铺常见的圆烧饼，巴掌大小）
烧饼:
  aliases: [烧饼]
  default: 普通
  units: {个: {g: 80}}
  variants:
    普通: {food: "011407"}
  lookalikes: [麻酱烧饼, 油酥烧饼, 黄桥烧饼, 缙云烧饼, 牛肉烧饼, 梅干菜烧饼, 芝麻烧饼]

# 成分表是“烙饼（标准粉）”，几乎不放油的那种（脂肪 2.3 克）。
烙饼:
  aliases: [烙饼]
  default: 普通
  variants:
    普通: {food: "011403"}
  lookalikes: [葱油烙饼, 葱花烙饼, 千层烙饼, 油酥烙饼, 糖烙饼]

# ==================== 薯芋 ====================

# 鲜红薯。成分表里红心 61 千卡、白心 106 千卡，差 1.7 倍，必须问；说不清时按红心（市面上最常见的“红薯”）。
# 份量依据：个 = 中等大小一个整重约 200 克（经验估计；对照 USDA SR：Sweet potato, raw, 1 sweetpotato 5" long = 130 g 可食部），
#   引擎乘可食部（红心 90%、白心 86%）。大小能差一倍，差得多的请说克数。
红薯:
  aliases: [红薯, 地瓜, 番薯, 甘薯, 山芋, 白薯]
  unsure: 红心
  units: {个: {gross_g: 200}}
  variants:
    红心: {food: "021205", aliases: [红瓤]}
    白心: {food: "021201", aliases: [白瓤]}

# 晒干的红薯片，和鲜红薯差 3–5 倍，单独一个概念。
红薯干:
  aliases: [红薯干, 地瓜干, 白薯干, 番薯干, 山芋干, 甘薯干]
  default: 普通
  variants:
    普通: {food: "021203"}

# 生土豆。蒸、煮、烤的成分表另有条目，在“蒸土豆”里。
# “土豆片”“土豆条”不算切法：可能是薯片、薯条，按另一种食物认。
# 份量依据：个 = 中等大小一个整重约 200 克（经验估计，大小能差一倍），引擎乘可食部 94%
土豆:
  aliases: [土豆, 马铃薯, 洋芋, 洋山芋, 山药蛋]
  default: 普通
  cuts: [丁, 块]
  units: {个: {gross_g: 200}}
  variants:
    普通: {food: "021101"}
  lookalikes: [狼牙土豆]

# 份量依据：个 = 同上那个中等土豆做熟去皮后约 190 克（经验估计；成分表蒸、煮、烤三个条目的可食部都是 100%）
蒸土豆:
  aliases: [熟土豆]
  default: 蒸土豆
  units: {个: {g: 190}}
  variants:
    蒸土豆: {food: "021106", names: [蒸土豆, 蒸马铃薯, 蒸洋芋]}
    煮土豆: {food: "021107", names: [煮土豆, 水煮土豆, 煮马铃薯, 煮洋芋]}
    烤土豆: {food: "021105", names: [烤土豆, 烤马铃薯, 烤洋芋]}

# 鲜山药。干山药片（成分表 047105，327 千卡）差 5.7 倍，这里没收，前面带“干”的叫法挡住。
山药:
  aliases: [山药, 淮山]
  default: 普通
  variants:
    普通: {food: "047104"}
  lookalikes: [干山药, 干淮山]

# 小芋头 56 千卡、槟榔芋 90 千卡，差 1.6 倍，必须问；说不清时按小芋头（各地都有、最常见）。
芋头:
  aliases: [芋头]
  unsure: 小芋头
  variants:
    小芋头: {food: "047203", names: [芋艿, 毛芋, 芋仔], aliases: [芋头仔]}
    大芋头: {food: "047202", names: [槟榔芋, 荔浦芋]}
  lookalikes: [反沙芋头]

# ==================== 豆和豆制品 ====================

# 干黄豆。泡过的黄豆另算（泡黄豆）。
黄豆:
