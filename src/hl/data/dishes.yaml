# 复合菜肴：成分表里没有，按菜谱拆成若干成分表条目来估算（增补第 11 节）。
# 用这里的条目记下的明细，来源一律是"菜谱估算"，标"成分是估的"（est 里有 content）。
# 自带菜谱优先于薄荷库的同名条目；炒菜不再自己扩充，交给薄荷库（增补第 13.2 节）。
# recipe 里的克数是一个单位（units 里 recipe: 1）对应的可食部生重；note 写这一行是什么。
# salt_g 是一个单位放多少克盐（必填，不放盐写 0），记账时是最后一行内置食盐 x:salt。
# serving_g 是一份（recipe: 1）成品的重量，用户按克说时靠它换算；没有它就只能按量词记。
# basis 写按什么估的、漏了什么、和独立参考值差多少。
# 用到按个数说的概念（鸡蛋、油条这类）时，克数要是一个或半个的倍数，不是的在 basis 或 note 里说明。
# hl check 会校验这些（src/hl/foods/lint.py）。

牛肉面:
  aliases: [牛肉面, 牛肉拉面, 兰州拉面]
  units: {碗: {recipe: 1}}
  basis: "配比是经验估计：煮好的面条 350 克、牛肉生重 70 克（熟重约 50 克）、汤里的油 8 克。一碗连汤约 750 克（面 350 克、牛肉约 50 克、汤约 350 毫升，经验估计），serving_g 按这个写；用户说的克数如果只是面和肉，会算少。salt_g 依据：香港食环署《本地粥粉麵飯的營養素含量》（2006，化验实测，https://www.cfs.gov.hk/tc_chi/programme/programme_rafs/files/congee_rice_and_noodles_c.pdf）配面条的汤面平均每碗钠 2800 毫克（连汤全部喝完），扣除面条和牛肉自带的约 150 毫克后折合约 6.7 克盐；按汤只喝一小半取 5 克，和西红柿鸡蛋面一致。5 克是估的：没有读到能把汤里的盐和面里的盐分开的数据，一口汤不喝会明显更低。"
  salt_g: 5
  serving_g: 750
  recipe:
    - {food: "011317", g: 350, note: 煮好的面条}
    - {food: "082119", g: 70, note: 牛肉（生重，约熟 50 克）}
    - {food: "192014", g: 8, note: 汤里的植物油}

# 带油的叫法写成菜谱，不补成鸡蛋的别名（增补第 11 节）。
煎蛋:
  aliases: [煎蛋, 荷包蛋, 煎鸡蛋, 煎荷包蛋]
  units: {个: {recipe: 1}}
  basis: "按增补第 11 节：鸡蛋 1 个、油 5 克。鸡蛋一个按 50 克可食部（和概念“鸡蛋”的量词一致，依据见概念表），油 5 克是增补给的数（经验估计，平底锅少油煎一个蛋；油多的煎法会更高）。一个约 50 克，约 114 千卡。水煮的荷包蛋（煮荷包蛋、水煮荷包蛋）不放油，是鸡蛋的别名，不按这道菜记。salt_g 依据：Du 等 Sodium content of restaurant dishes in China（Nutrition Journal 2022，DOI 10.1186/s12937-022-00762-4，只读到摘要）餐馆菜钠中位数里食材以外的部分折合约 1.0 克盐/100 克成品，50 克约 0.5 克；家里煎蛋不放盐的话会偏高。"
  salt_g: 0.5
  serving_g: 50
  recipe:
    - {food: "111101x", g: 50, note: 鸡蛋 1 个}
    - {food: "192014", g: 5, note: 煎蛋的植物油}

