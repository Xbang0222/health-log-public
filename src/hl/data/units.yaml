# 份量用的单位和量词（增补第 4、6 节）。在原话里认份量、把模型传的单位归一，都按这张表。
#
# weight、volume：通用重量、体积单位，合多少克、多少毫升。forms 是认得的写法，
# 第一个是引擎记下的叫法（g、ml 照第 1 步的写法）。两、斤、公斤、升前面必须有数字或“半”
# 才算单位（“两个”的“两”是数）。概念和菜谱自己的量词优先于这里的通用单位。
weight:
  g: {g: 1, forms: [g, 克, 公克]}
  两: {g: 50, forms: [两]}
  斤: {g: 500, forms: [斤, 市斤]}
  公斤: {g: 1000, forms: [公斤, 千克, kg]}
volume:
  ml: {ml: 1, forms: [ml, 毫升]}
  升: {ml: 1000, forms: [升, l]}

# 通用量词：前面带着数（或“半”）就是一处份量。库里没有的食物，这里任何量词都是合法的份量，
# 原样交给估算通道。概念表、菜谱用到的量词都得在这里（有测试钉住）
counters: [
  个, 只, 根, 条, 块, 片, 串, 把, 勺, 份, 盘, 碗, 杯, 瓶, 盒, 袋, 包, 罐, 听, 颗, 粒,
  屉, 笼, 套, 碟, 盆, 锅, 壶, 桶, 盅, 张, 枚, 支, 节, 段, 瓣, 棵, 头, 卷, 扎,
  汤匙, 茶匙, 瓷勺, 调羹,
]

# 是量词但说的不是份量（“两个人”“一次”“一顿”“三天”）：不当份量认，不进上面那张表
not_portions: [人, 次, 顿, 天]

# 这几个量词前面没有数字时，多半说的不是份量（“只吃了一个”“把鸡蛋吃了”）：前面得有数字才认
need_number: [只, 把]
