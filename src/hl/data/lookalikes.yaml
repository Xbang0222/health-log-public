# 每个词只能有一种身份：和概念别名、品种叫法、做法词撞了，数据校验报错（增补第 13.4 节）。

# 不是同一种东西：包含某个别名，却是另一种食物。原话里出现要有对应项，按“另一种食物”认
# （第 2.5 节）。也可以跟着概念写在概念表的 lookalikes 里，加载时并在一起。
# 尾巴规则盖得住的（牛肉干、豆腐干、香蕉片：别名后面多一两个字）不用写；要写的是别名前面
